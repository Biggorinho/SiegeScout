[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siegescout"
version = "0.1.0"
description = "Hero Siege automation bot (computer-vision driven)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
    "mss>=6.1",
    "keyboard>=0.13",
    "Pillow>=9.0",
    "httpx>=0.24",
    "onnxruntime>=1.20",
    "rapidocr-onnxruntime>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "nuitka>=1.8",
]

[tool.setuptools]
py-modules = [
    "main",
    "gui",
    "combat",
    "config",
    "detectors",
    "input_control",
    "minimap",
    "pathfinding",
    "state",
    "stats_tracker",
    "fusion",
    "local_inference",
    "targeting",
    "satanic_name",
    "hud_ocr",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
