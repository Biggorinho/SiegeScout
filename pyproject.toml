[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siegescout"
version = "0.1.0"
description = "Hero Siege automation bot (computer-vision driven)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
    "mss>=6.1",
    "keyboard>=0.13",
    "Pillow>=9.0",
    "onnxruntime>=1.20",
    "rapidocr-onnxruntime>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "nuitka>=1.8",
]
# Live session stats via packet capture (stats_tracker.py); also needs Npcap.
stats = [
    "scapy>=2.5",
    "psutil>=5.9",
]

[tool.setuptools]
# Runtime modules reachable from main.py / gui.py. Dev tooling (build.py,
# analyze_debug.py, eval/, tools/, training/) is run from the repo, not installed.
py-modules = [
    "main",
    "gui",
    "combat",
    "config",
    "debug_utils",
    "detectors",
    "fusion",
    "hud_ocr",
    "input_control",
    "local_inference",
    "map_scroll",
    "minimap",
    "satanic_name",
    "screen_motion",
    "skills",
    "stats_tracker",
    "targeting",
]
packages = ["pathfinding", "state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
